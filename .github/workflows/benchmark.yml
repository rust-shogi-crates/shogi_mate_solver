name: Benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cargo version
        run: cargo --version
      - name: Run benchmark comparison
        env:
          BENCHMARK_BASE_REF: ${{ github.base_ref || 'HEAD' }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          cargo run --locked -p benchmark_harness -- run --strict --revision=current benchmark/issue13-smoke.jsonl > benchmark-output/benchmark-current.jsonl
          git worktree add /tmp/shogi-mate-solver-base origin/${BENCHMARK_BASE_REF}
          git diff origin/${BENCHMARK_BASE_REF}...HEAD -- Cargo.toml Cargo.lock mate_solver/src/df_pn/search.rs mate_solver/src/eval/search.rs benchmark_harness/Cargo.toml benchmark_harness/src/main.rs benchmark/issue13-smoke.jsonl > benchmark-output/benchmark-harness.patch
          git -C /tmp/shogi-mate-solver-base apply "${GITHUB_WORKSPACE}/benchmark-output/benchmark-harness.patch"
          cargo run --locked --manifest-path /tmp/shogi-mate-solver-base/Cargo.toml -p benchmark_harness -- run --strict --revision=base /tmp/shogi-mate-solver-base/benchmark/issue13-smoke.jsonl > benchmark-output/benchmark-base.jsonl
          cargo run --locked -p benchmark_harness -- compare --base benchmark-output/benchmark-base.jsonl --current benchmark-output/benchmark-current.jsonl --html benchmark-output/benchmark-report.html > benchmark-output/benchmark-comparison.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-harness-results
          path: |
            benchmark-output/benchmark-base.jsonl
            benchmark-output/benchmark-current.jsonl
            benchmark-output/benchmark-comparison.jsonl
            benchmark-output/benchmark-report.html

name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings

jobs:
  build:
    strategy:
      matrix:
        cargo-bloat-version:
          - "0.12.1"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: "clippy,rustfmt"
      - name: cargo version
        run: cargo --version
      - name: install cargo-bloat (v${{ matrix.cargo-bloat-version }})
        run: cargo install cargo-bloat --version ${{ matrix.cargo-bloat-version }}
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose --locked
      - name: Run clippy
        run: cargo clippy --all-targets --locked
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run benchmark comparison
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          cargo run --locked --bin benchmark_harness -- run --strict --revision=current benchmark/issue13-smoke.jsonl > benchmark-output/benchmark-current.jsonl
          git worktree add /tmp/shogi-mate-solver-base origin/${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD -- Cargo.toml Cargo.lock mate_solver/src/df_pn/search.rs mate_solver/src/eval/search.rs src/bin/benchmark_harness.rs benchmark/issue13-smoke.jsonl > benchmark-output/benchmark-harness.patch
          git -C /tmp/shogi-mate-solver-base apply "${GITHUB_WORKSPACE}/benchmark-output/benchmark-harness.patch"
          cargo run --locked --manifest-path /tmp/shogi-mate-solver-base/Cargo.toml --bin benchmark_harness -- run --strict --revision=base /tmp/shogi-mate-solver-base/benchmark/issue13-smoke.jsonl > benchmark-output/benchmark-base.jsonl
          cargo run --locked --bin benchmark_harness -- compare --base benchmark-output/benchmark-base.jsonl --current benchmark-output/benchmark-current.jsonl --html benchmark-output/benchmark-report.html > benchmark-output/benchmark-comparison.jsonl
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: benchmark-harness-jsonl
          path: |
            benchmark-output/benchmark-base.jsonl
            benchmark-output/benchmark-current.jsonl
            benchmark-output/benchmark-comparison.jsonl
            benchmark-output/benchmark-report.html
      - name: Document
        run: cargo doc --verbose
      - name: cargo bloat (display, release)
        run: |
          cargo bloat --release --bin mate_solver
          cargo bloat --release --bin to_sfen
      - name: cargo bloat (display, per-crate, release)
        run: |
          cargo bloat --release --crates --bin mate_solver
          cargo bloat --release --crates --bin to_sfen

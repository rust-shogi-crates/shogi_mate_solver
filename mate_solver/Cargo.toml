[package]
name = "mate_solver"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
once_cell = "1"
shogi_legality_lite = { git = "https://github.com/rust-shogi-crates/shogi_legality_lite", rev = "78bdf325c25bdf89406672a280ad0c518c98bb25" }
shogi_core = { version = "0.1.4", features = ["hash"] }
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }

[dev-dependencies]
shogi_usi_parser = "0.1"
